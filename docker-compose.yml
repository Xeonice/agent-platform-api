# Single-machine deployment (docs/shared/11 §1). SECURITY DEFAULTS ARE LOAD-BEARING:
#   - api binds 127.0.0.1 only (audit P0-3). Changing to 0.0.0.0 must be explicit
#     and triggers a startup warning + a persistent banner.
#   - docker-socket-proxy whitelists ONLY CONTAINERS / EXEC / IMAGES — the api
#     never touches the raw docker.sock (container-escape surface收敛).
services:
  api:
    # ⚠️ 版本三元组从**宿主环境**透传进构建期(Dockerfile 的三个 ARG),运行期由
    #   `GET /api/system/version` 原样报出。⛔ 三个都**不给默认值**:留空时端点如实回
    #   `null`,而一个写死的默认版本号会让每一次忘了设的构建都报出同一个假版本。
    #
    #   出厂就带版本号请这样起(在 `api/` 目录里,即本文件所在目录,跑 `docker compose up`):
    #     APP_VERSION=$(git -C "$(git rev-parse --show-superproject-working-tree)" describe --tags --always) \
    #     APP_COMMIT=$(git -C "$(git rev-parse --show-superproject-working-tree)" rev-parse HEAD) \
    #     APP_BUILT_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ) \
    #     docker compose up --build
    #
    #   ⚠️ 版本取的是**主仓**的 tag(平台版本只在主仓上打,只有主仓钉得住 api/web 两个
    #   submodule 指针 = 一份可复现的部署状态),不是 api 子仓的。
    #   ⛔ **这里此前写的是 `git describe --tags --always`(不带 `-C`)—— 那是错的**
    #   (2026-09-18 实测推翻):用户是在 `api/` 目录里跑 compose,而 `api/` 是**它自己
    #   的 git 仓库**(submodule 有独立的 .git),裸 `git describe` 走的是 api 仓自己那条
    #   tag 时间线(实测拿到 `sandbox-image-v2-…`),不是主仓的 `v0.1.0`。
    #   `git rev-parse --show-superproject-working-tree` 是 git 自带的「我在哪个主仓的
    #   submodule 里」探测,从 `api/` 内的任何子目录跑都答得对(不依赖「主仓就是上一级
    #   目录」这个此前默认成立、以后目录一挪就碎的假设),实测在本仓返回
    #   `.../云agent管理平台`,再拿它 `describe` 才是 `v0.1.0`。
    build:
      context: .
      args:
        APP_VERSION: ${APP_VERSION:-}
        APP_COMMIT: ${APP_COMMIT:-}
        APP_BUILT_AT: ${APP_BUILT_AT:-}
    ports:
      - '127.0.0.1:3000:3000' # ★ loopback only — do NOT change to 0.0.0.0 without intent
    environment:
      HOST: 0.0.0.0 # inside the container; host-side exposure is gated by the ports bind above
      # ⚠️ 上面那行 `HOST: 0.0.0.0` 是**必须**的(容器里绑 loopback,外面那行 `ports:` 就转
      #   不进来),于是 compose 形态下每一次启动都会打一条「HTTP is bound to 0.0.0.0」
      #   WARN —— 而它**每一次都不代表出错**。一条恒真的告警会训练用户忽略告警,
      #   而这条告警存在的全部理由是有朝一日真的有人把实例挂到公网上时它能被看见。
      # ⇒ 下面这一行是**一句声明,不是一个开关**(与 SANDBOX_DOCKER_NETWORK 同一形状):
      #   填了它 ⇒ 那条 WARN 降为一条 INFO,并把这句话**原样**打进日志(可审计);
      #   留空 ⇒ 行为一字不变,照旧 WARN。
      # ⚠️ 平台**验证不了**这句声明 —— 进程内看不见外侧发布在哪。改动上面那行 `ports:`
      #   的人有责任同时改这里,否则你亲手关掉的是一条安全告警。
      # ⚠️ 整行加引号:默认值里那个 `: ` 不加引号会被 YAML 当成一个嵌套映射(实测
      #   `docker compose config` 直接报 mapping values are not allowed in this context)。
      HTTP_BIND_GATED_BY: '${HTTP_BIND_GATED_BY:-compose ports: 127.0.0.1:3000:3000 (loopback only)}'
      PORT: '3000'
      # ⚠️ 没有这一行,`createDockerClient()` 会回落到 `/var/run/docker.sock` ——
      # 而那个 socket **没有**挂进 api 容器,于是下面那个 docker-socket-proxy 白挂了:
      # api 根本连不上 docker,第一个 Task 就起不来。代码注释里写的就是这个值。
      DOCKER_HOST: tcp://docker-proxy:2375
      # ⚠️ 必须显式给。平台内置默认是 `alpine:3.20`(见 SandboxApplicationService),
      # 而 alpine 里没有沙箱内 API、没有 tmux、也**没有常驻进程会立刻退出** ——
      # 容器一退 `NetworkSettings.Ports` 就空,第一个 Task 直接死在
      # `agent port 8080 is not published`(11 §1.3 坑二,本次 compose 验证当场复现)。
      # 不设这一行 ⇒ 照着本文件部署出来的平台**开箱即坏**。
      #
      # ⛔ **兜底值此前是 `ghcr.io/agent-infra/sandbox:latest` —— 那是 Dockerfile 的 `FROM`
      #    对象,不是可用的预制镜像**(2026-09-07 改,P21-8 §2.2)。它拉得到、也过得了血统
      #    检查(自带 tmux,在已知表里),于是 compose 部署**不报任何错就起来了** ——
      #    但它**没装 claude-code**(`images/platform-sandbox/Dockerfile` 实测:上游自带
      #    tmux 3.2a / node 22 / codex 0.139,唯独没有 claude-code)。
      #
      #    ⚠️ **这比「第一次启动报找不到」更糟:它不报错,只是慢。** 现装 claude-code 实测
      #    **753 秒(12.5 分钟)**,而那 12.5 分钟会落在**每一个** claude-code Task 上,
      #    永远。用户不会把「任务好慢」联想到「compose 的一行默认值指错了镜像」。
      #
      # ⇒ **兜底值留空**,与 `.env.example` 同一个值(此前这两处默认值不同,是同一个变量
      #   的两个真相源)。留空 = 让平台按机器选:darwin ⇒ agent-platform-boxlite,
      #   linux ⇒ agent-platform-sandbox,两张都由 CI 发布、预装了 claude-code。
      #
      # ⛔ **别在这里填一个具体坐标** —— 一填,按档自动选就永远不生效
      #    (`builtinImageRefFor` 判的正是「配了没有」):mac 上默认档是 boxlite,
      #    却会拿到填进去的那张 —— 拉得到、播得下去,**在建任务门口才撞
      #    IMAGE_PROVIDER_MISMATCH**。一个填错的"贴心默认"比留空更难查。
      #    ⚠️ `pnpm check:default-image` 守着这一条。
      SANDBOX_DEFAULT_IMAGE: ${SANDBOX_DEFAULT_IMAGE:-}
      # 运维方对**实际用的那张**镜像的一句声明:它装了 tmux 吗(04 §7 ★血统)。
      # ⚠️ 留空 ⇒ 平台查内置的已知镜像表(`agent-platform-sandbox` / `agent-platform-boxlite`
      #   / `agent-infra/sandbox` / `platform/sandbox`,含内网 mirror)。**按机器自动选出来
      #   的那两张都在表里,所以什么都不配也能起**;换成一张平台不认识的镜像时**必须**在
      #   这里显式声明,否则开机播种会响亮失败。
      # ⚠️ 那张表只回答「有没有 tmux」,**不回答「装没装 claude-code」** —— 后者由出厂
      #   坐标本身保证(§2.2),别指望这一格拦住一张指错了的镜像。
      # ⚠️ 它防的是「指错了镜像」,不是「谎报」——谎报由运行期 `command -v tmux` 抓。
      SANDBOX_DEFAULT_IMAGE_TMUX: ${SANDBOX_DEFAULT_IMAGE_TMUX:-}
      # 按档覆盖预制镜像(ADR 决策 C)。**单档部署留空即可** —— 留空 = 两档共用上面那张,
      # 与本次改动前的行为一字不差。两档的镜像不可互换,平台会在建任务门口拦下
      # (IMAGE_PROVIDER_MISMATCH),判据是血统而不是任何一句声明。
      SANDBOX_AIO_IMAGE: ${SANDBOX_AIO_IMAGE:-}
      SANDBOX_BOXLITE_IMAGE: ${SANDBOX_BOXLITE_IMAGE:-}
      # ⛔⛔ **这一行是 compose 形态能不能建出 Task 的开关**(11 §1.4)。
      #
      # 不设它 ⇒ 平台按「裸跑在宿主」那套坐标说话:沙箱 agent 端口发布到**宿主的**
      # loopback,而 agentOrigin 拼成 `http://127.0.0.1:<port>`。api 自己在容器里,
      # 它的 127.0.0.1 是**它自己的** loopback ⇒ 沙箱容器 `Up (healthy)`、镜像播种
      # 成功、health 200,而**每一个 Task 都死在**
      #   `PROVIDER_UNAVAILABLE: in-sandbox agent at http://127.0.0.1:<port> did not become ready`
      # (2026-08-29 真 Linux 实测)。
      #
      # 设成下面那个网络名 ⇒ 沙箱容器加入**同一个**用户自定义网络,平台改用**容器名**
      # 说话(`http://platform-aio-<id>:8080`,走 docker 内嵌 DNS),并且 agent 端口
      # **一个都不发布** —— 暴露面比裸跑那档还小。
      #
      # ⚠️ 它是一句**声明**,不是一个开关:填了就等于说「沙箱放到这个网络里,而我自己
      # 也在这个网络里」。两件事必须同时为真,所以下面 `networks:` 那两处与这里是一体的。
      #
      # ✅ **后半句从 2026-08-30 起在开机时被真的验一次**(`self-network-check.ts`):
      #   平台会问 daemon「这个网络上有哪些容器、地址是什么」,再与本进程自己持有的
      #   地址取交集 —— 交集为空就**开机失败**,而不是让每个沙箱静静卡在 starting。
      #   在此之前,填错这一行的症状是「无错误、无超时、无一行日志」,实测卡 6 分钟以上。
      SANDBOX_DOCKER_NETWORK: ${SANDBOX_DOCKER_NETWORK:-platform-sandbox-net}
      # 明文(http)registry 的允许名单,逗号分隔的 `host:port`(与 docker daemon 自己的
      # `insecure-registries` 同形状)。
      # ⚠️ 留空时**只有** `localhost` / `127.0.0.1` / `[::1]` 走 http —— 而那几个字面量
      #   在容器里指的是**容器自己**,于是 compose 下配不出可用的本机 registry。
      #   要用本机/内网明文 registry,这里显式列出它,并保证**宿主 daemon 与 api 容器
      #   用同一个 host:port 解析得到同一个 registry**(见 api/images/README.md)。
      IMAGE_REGISTRY_INSECURE_HOSTS: ${IMAGE_REGISTRY_INSECURE_HOSTS:-}
      # ⚠️ 宿主路径 = 容器路径,这是 bind mount 方案的**硬约束**(11 §1.2):
      # DooD 下 api 请求挂载 `${DATA_ROOT}/workspaces/<id>` 时,这个路径由**宿主的**
      # 容器运行时解析,而不是 api 容器的命名空间。两边不同名 ⇒ 挂载源找不到。
      # 此前这里写死 `/data` 而卷是 `${DATA_ROOT}:/data`,默认值下两边并不相等。
      DATA_ROOT: ${DATA_ROOT:-/srv/agent-platform/data}
      DATABASE_URL: ${DATA_ROOT:-/srv/agent-platform/data}/platform.db
      # ⛔⛔ **compose 的 `./.env` 只对本文件里的 `${VAR}` 做字符串插值,不会把变量
      #   注入容器** —— 这两件事长得像,行为完全不同。运维方在 `api/.env` 里写下
      #   `ACCESS_PASSCODE=xxxx` 重启,以为门锁上了;实际上如果这里没有对应的
      #   `ACCESS_PASSCODE: ${ACCESS_PASSCODE:-}`,容器内的 `process.env.ACCESS_PASSCODE`
      #   仍是 undefined,`PasscodeService.source` 落成 `'none'`、`PasscodeGuard` 照旧
      #   自禁用 —— **看起来做了、实际没有**,而且不报任何错误。
      #   ⇒ 下面每新增一个「运维方会在 `.env` 里填」的变量,都必须在这里配一行同名透传,
      #   否则它对 compose 部署形态就是个死字段。新增变量时先问一句:「这个值
      #   `process.env.X` 在 api 进程里真的会被读到吗」——只在 `.env.example` 里但没人读的
      #   不用管,过一遍 `grep process.env` 就知道。
      #
      # Access passcode(.env.example 213-215,shared/11 §3.1)。留空 = 门禁关闭
      # (`NoopAuthGuard`)。
      ACCESS_PASSCODE: ${ACCESS_PASSCODE:-}
      # 预制镜像搬运源(.env.example 217-235,`preset-image-provisioner.ts`)。两个都留空
      # 时平台走 `provider-stage`(见 A5 订正,不是 `.env.example` 原先说的
      # `upstream-copy`)——单档出厂部署本来就不需要配这两行,但既然 `.env.example` 把它们
      # 摆在「运维方可能会填」的位置,compose 就不能假装它们不存在。
      # ⚠️ `SANDBOX_IMAGE_ASSETS_DIR` 若真的填了,它指向的必须是一个**宿主路径**、且
      #   要用上面 `volumes:` 同款的「宿主路径 = 容器路径」bind mount 显式挂进来 ——
      #   本文件不替它加这条 volume(留空是绝大多数部署的常态,提前挂一个不存在的路径
      #   反而会重演 A4 那种「compose 直接起不来」)。只透传环境变量、不接文件系统的这一半,
      #   同样是「填了等于没填」的坑,只是从「门禁」换成了「搬镜像」。
      SANDBOX_IMAGE_ASSETS_DIR: ${SANDBOX_IMAGE_ASSETS_DIR:-}
      SANDBOX_PRESET_IMAGE_SOURCE: ${SANDBOX_PRESET_IMAGE_SOURCE:-}
      # ⛔ **`HTTP_PROXY` / `HTTPS_PROXY` / `NO_PROXY` 故意不在这里**——核实过
      #   (`connectivity.probe.ts` / `outbound-network.check.ts` / `proxy-redaction.ts`)
      #   之后发现这三个从来不是 api 进程会读的**环境变量**:代理坐标是「系统设置」里的
      #   `httpProxy` / `httpsProxy` / `noProxy`,存在 `system_settings` 表里,由初始化
      #   向导 / 系统设置页写入,不经 `process.env`。所有代码里出现这三个大写名字的地方
      #   都是**提示用户去系统设置页填**的人话字符串,不是这个进程自己会 `process.env.` 读的
      #   东西。⇒ 加了也没用,不加也不缺——真要过一遍 `grep process.env` 才敢下这个结论,
      #   不要凭名字眼熟就当它们是同一类变量。
    # ⚠️ **这一行是 `api/images/README.md` 那份「本机明文 registry」配方的一部分,不是
    #   可选项**(2026-08-30 从零复验的落差:配方要求 api 服务带 `extra_hosts`,而本文件
    #   此前一个字都没有 —— 照配方做的人会发现容器里 `registry.local` 解析不出来,
    #   而症状与「registry 根本没起」一模一样)。不用本机 registry 时它是一条无害的
    #   /etc/hosts 记录,所以默认就带着,而不是留一段要人手动解注释的注释。
    # ⚠️ 配套的另一半:registry **不能只发布在宿主 127.0.0.1 上**。`host-gateway` 解析到
    #   的是宿主网关 IP(实测 WSL2 上是 192.168.65.254),从那个地址连不到只绑在 loopback
    #   上的端口。起它要用 `-p 15001:5000`(不带 127.0.0.1: 前缀),见 images/README.md。
    extra_hosts:
      - 'registry.local:host-gateway'
    volumes:
      # 同名挂载（见上）：宿主的 $DATA_ROOT 落到容器内**同一个绝对路径**。
      - ${DATA_ROOT:-/srv/agent-platform/data}:${DATA_ROOT:-/srv/agent-platform/data}
    networks:
      # `default` 是 api ↔ docker-proxy 那条；`sandbox` 是 api ↔ 沙箱容器那条。
      # ⚠️ 一旦给一个服务写了 `networks:`,compose 就**不再**自动把它接到 default 上,
      #   少写 `default` 这一行的后果是 api 连不上 docker-proxy —— 一个 Task 都建不出来。
      - default
      - sandbox
    # ⚠️ 单机私有化部署没有编排器帮你重启 —— `restart` 策略就是这台机器唯一的自愈手段。
    #   `unless-stopped` 而不是 `always`:宿主重启后如果运维方手动 `docker compose stop`
    #   过,不希望下一次开机把它悄悄拉起来(`always` 会无视这次手动停止)。
    restart: unless-stopped
    # ⚠️ 探针必须是**真实存在的端点**——`health.controller.ts` 挂在 `@Controller('health')`,
    #   而 `configure-app.ts` 里 `app.setGlobalPrefix('api')`,合起来是 `/api/health`,
    #   ⛔ 不是裸的 `/health`(2026-09-18 读代码核实,此前口头猜过一次 `/health`,是错的)。
    #   它是 `PasscodeGuard` 唯一豁免的端点(见该文件注释),所以健康检查不用管
    #   ACCESS_PASSCODE 有没有配。
    # ⚠️ 探针用 `node` 里置的 `fetch` 而不是 `curl`/`wget`——runtime 镜像**没有**这两个
    #   二进制(A1 只装了 git/openssh-client/ca-certificates,没有理由再为了一次自检多装
    #   一个包),而 `node` 反正在镜像里(它就是拿来跑 `apps/api/dist/main.js` 的),用它
    #   自己发一次请求不多花一粒字节。
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s # 迁移在启动时跑(Dockerfile 头部注①),给它一点余量再开始判定
    # ⛔⛔ **此前只有 `depends_on: [docker-proxy]`(隐式 `condition: service_started`)——
    #   那只保证 docker-proxy **容器起了**,不保证它**能应答**。haproxy 需要时间加载配置,
    #   api 若在这个窗口期第一次连 `tcp://docker-proxy:2375` 会直接连接失败,而这只在
    #   「建第一个 Task 之前」的这几秒钟窗口内才会发生,复现全靠运气(A3 描述的正是这条)。
    #   收紧到 `service_healthy`,靠的正是上面给 docker-proxy 新加的 `/_ping` 探针 ——
    #   两者是一体的:没有探针就没有「健康」这个状态可等。
    depends_on:
      docker-proxy:
        condition: service_healthy

  docker-proxy:
    image: tecnativa/docker-socket-proxy
    # 同上:单机部署没有编排器,`docker-proxy` 挂了 api 的每一次 docker 调用都会失败,
    # 必须能自己起来。
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment: # only the API surfaces the aio provider needs
      CONTAINERS: '1'
      EXEC: '1'
      IMAGES: '1'
      POST: '1'
    # `/_ping` 是这张镜像内置的 haproxy 健康探针路径,**不受**上面的 CONTAINERS/EXEC/
    # IMAGES/POST 白名单限制(那份名单管的是 docker API 代理转发,`_ping` 是它自己应答的
    # 固定路由)——实测即使只开这四项,`wget -qO- http://localhost:2375/_ping` 依旧回
    # `OK`。镜像基于 alpine,**没有** `curl`,但**有** `wget`(实测)。
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:2375/_ping']
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  # auth-helper: resident lightweight helper reusing the default AIO image
  # (11 §1.1). Reserved — the CLI login flow lands in the runtime slice.

networks:
  sandbox:
    # ⛔⛔ **`name:` 这一行不能省。** compose 默认会给网络加项目名前缀
    # （`<项目名>_sandbox`），而 `SANDBOX_DOCKER_NETWORK` 里写的是**docker 侧的真名**
    # ——两者对不上时的症状极其难查：api 起得来、沙箱容器也起得来,只是它被塞进了一个
    # 不存在/不同的网络,于是 `agentOrigin` 报
    # `container … is not attached to the docker network '…'`。
    # 显式 `name:` 关掉前缀,让「配置里写的」与「docker 里叫的」是同一个字符串。
    name: ${SANDBOX_DOCKER_NETWORK:-platform-sandbox-net}
